<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studio Tabi</title>
  <!-- Meta descrição base (o CMS sobrescreve em tempo de execução). -->
  <meta name="description" content="Studio Tabi — design, estratégia e desenvolvimento para transformar presença digital em valor, confiança e decisão."/>
  <!-- Preload das fontes críticas (auto-hospedadas) para acelerar o LCP.
       Roboto Condensed (título do hero) e Be Vietnam Pro 400 (corpo). -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/ieVl2ZhZI2eCN5jzbjEETS9weq8-19K7DQ.woff2" crossorigin/>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/QdVPSTAyLFyeg_IDWvOJmVES_Hw3BXo.woff2" crossorigin/>
  <!-- Abre a conexão com o CMS antecipadamente: o primeiro fetch do conteúdo
       não paga DNS + TLS, o que adianta o preenchimento da página. -->
  <link rel="preconnect" href="https://cms.studiotabi.com.br" crossorigin/>
  <link rel="dns-prefetch" href="https://cms.studiotabi.com.br"/>
  <!-- Configuração de runtime: aponta para o WordPress. Editável no servidor.
       O ?v evita que uma versão antiga fique presa no cache do navegador/CDN
       e deixe o site sem conteúdo do CMS. Ao alterar o config.js, troque o
       número para forçar a releitura. -->
  <script src="/config.js?v=2"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
