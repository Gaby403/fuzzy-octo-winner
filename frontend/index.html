<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Studio Tabi</title>
  <!-- Meta descrição base (o CMS sobrescreve em tempo de execução). -->
  <meta name="description" content="Studio Tabi — design, estratégia e desenvolvimento para transformar presença digital em valor, confiança e decisão."/>
  <!-- Preload das fontes críticas (auto-hospedadas) para acelerar o LCP.
       Roboto Condensed (título do hero) e Be Vietnam Pro 400 (corpo). -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/ieVl2ZhZI2eCN5jzbjEETS9weq8-19K7DQ.woff2" crossorigin/>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/QdVPSTAyLFyeg_IDWvOJmVES_Hw3BXo.woff2" crossorigin/>
  <!-- Sem preconnect para o CMS: o conteúdo vem do próprio domínio (o api.php
       repassa), então a conexão já está aberta — e o endereço do WordPress não
       precisa aparecer no HTML. -->
  <!-- Configuração de runtime. Fica vazia por padrão: o endereço do WordPress
       mora no cms-config.php, do lado do servidor. Só preencha aqui se quiser
       falar direto com o CMS (desenvolvimento). O ?v força a releitura quando
       o arquivo mudar. -->
  <script src="/config.js?v=3"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
