<style>
    /* =========================================================
   TABI — DEEP LANDSCAPE HERO
========================================================= */

#tabiDepthHero,
#tabiDepthHero * {
  box-sizing: border-box;
}


/* =========================================================
   HERO
========================================================= */

#tabiDepthHero {
  --tabi-red: #F20C25;
  --tabi-white: #EFEFEF;
  --tabi-black: #111111;

  position: relative;

  width: 100%;

  /* Fallback + viewport estável + viewport dinâmico */
  height: 100vh;
  height: 100svh;
  height: var(--tabi-hero-height, 100svh);
  min-height: 680px;

  overflow: hidden;
  isolation: isolate;
  transform: translateZ(0);

  background-color: var(--tabi-white);
  background-image: none !important;

  color: var(--tabi-black);
}


#tabiDepthHero::before,
#tabiDepthHero::after {
  content: none !important;
  display: none !important;
}


/* =========================================================
   FUNDO PRETO CIRCULAR
========================================================= */

.tabi-depth__black-anchor {
  position: absolute;

  z-index: 0;

  left: 75%;
  top: 43%;

  width: clamp(310px, 31vw, 600px);
  aspect-ratio: 1 / 1;

  transform: translate(-50%, -50%);

  pointer-events: none;
}


.tabi-depth__black-reveal {
  width: 100%;
  height: 100%;

  border-radius: 50%;

  background-color: var(--tabi-black);

  transform: scale(0);
  transform-origin: center;

  will-change: transform;
}


/* =========================================================
   SCENE
========================================================= */

.tabi-depth__scene {
  position: absolute;
  inset: 0;

  z-index: 1;

  width: 100%;
  height: 100%;

  overflow: hidden;

  pointer-events: none;
}


/* =========================================================
   SUN ANCHORS
========================================================= */

.tabi-depth__sun-anchor {
  position: absolute;

  left: 75%;
  top: 43%;

  width: clamp(310px, 31vw, 600px);
  aspect-ratio: 1 / 1;

  transform: translate(-50%, -50%);

  pointer-events: none;

  will-change: transform;
}


.tabi-depth__sun-anchor--red,
.tabi-depth__sun-anchor--white {
  z-index: 1;
}


/* =========================================================
   SUN
========================================================= */

.tabi-depth__sun {
  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  transform-origin: center;

  pointer-events: none;

  will-change:
    transform,
    opacity;
}


.tabi-depth__sun--red {
  background-color: var(--tabi-red);
}


.tabi-depth__sun--white {
  background-color: var(--tabi-white);

  opacity: 0;

  transform: scale(.72);
}


/* =========================================================
   KANJI
========================================================= */

.tabi-depth__kanji {
  display: block;

  font-family:
    "Noto Serif JP",
    serif;

  font-size: clamp(85px, 8vw, 158px);

  font-weight: 900;

  line-height: .8;

  letter-spacing: -.12em;

  white-space: nowrap;

  color: var(--tabi-black);

  pointer-events: none;
  user-select: none;

  will-change:
    opacity,
    transform;
}


/* =========================================================
   MONTANHAS

   VISÍVEIS DESDE O PRIMEIRO FRAME.
========================================================= */

.tabi-depth__mountain {
  position: absolute;

  left: -2%;

  width: 104%;

  opacity: 1;
  visibility: visible;

  pointer-events: none;

  display: block;
  overflow: visible;
  backface-visibility: hidden;

  transform: translate3d(0, 0, 0);
  transform-origin: center bottom;

  will-change:
    transform,
    color;
}


.tabi-depth__mountain--haze {
  z-index: 2;

  bottom: 16%;

  height: 39%;

  color: #E3E3E3;
}


.tabi-depth__mountain--far {
  z-index: 3;

  bottom: 10%;

  height: 36%;

  color: #C7C7C7;
}


.tabi-depth__mountain--middle {
  z-index: 5;

  bottom: 4%;

  height: 31%;

  color: #777777;
}


.tabi-depth__mountain--front {
  z-index: 6;

  bottom: -2px;

  height: 23%;

  color: var(--tabi-black);
}



/* =========================================================
   CONTENT
========================================================= */

.tabi-depth__content {
  position: absolute;

  z-index: 10;

  top: 0;
  left: 0;
  bottom: 0;

  width: min(46%, 780px);

  display: flex;

  flex-direction: column;

  justify-content: center;
  align-items: flex-start;

  padding:
    55px
    0
    155px
    clamp(38px, 4vw, 82px);

  pointer-events: none;
}


/* =========================================================
   EYEBROW
========================================================= */

.tabi-depth__eyebrow {
  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 28px;

  font-family:
    "Be Vietnam Pro",
    sans-serif;

  font-size: 9px;

  font-weight: 600;

  line-height: 1;

  letter-spacing: .17em;

  color: rgba(17, 17, 17, .52);

  will-change: color;
}


.tabi-depth__eyebrow-dot {
  display: block;

  width: 7px;
  height: 7px;

  flex: 0 0 7px;

  border-radius: 50%;

  background-color: var(--tabi-red);

  will-change: background-color;
}


/* =========================================================
   TITLE
========================================================= */

.tabi-depth__title {
  width: 100%;
  max-width: 760px;

  margin: 0;

  font-family:
    "Roboto Condensed",
    sans-serif;

  font-size: clamp(58px, 5.2vw, 100px);

  font-weight: 900;

  line-height: .79;

  letter-spacing: -.05em;

  text-transform: uppercase;

  color: var(--tabi-black);

  will-change: color;
}


.tabi-depth__title span {
  display: block;

  white-space: nowrap;

  color: inherit;
}


.tabi-depth__title strong {
  font: inherit;

  color: var(--tabi-red);

  will-change: color;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.tabi-depth__description {
  width: min(88%, 500px);

  margin: 34px 0 0;

  font-family:
    "Be Vietnam Pro",
    sans-serif;

  font-size: clamp(13px, .9vw, 16px);

  font-weight: 400;

  line-height: 1.65;

  color: rgba(17, 17, 17, .58);

  will-change: color;
}


/* =========================================================
   FOOTER
========================================================= */

.tabi-depth__footer {
  position: absolute;

  z-index: 12;

  left: 0;
  bottom: 0;

  width: 100%;

  display: flex;

  align-items: center;
  justify-content: space-between;

  padding:
    0
    clamp(38px, 4vw, 82px)
    32px;

  font-family:
    "Be Vietnam Pro",
    sans-serif;

  font-size: 10px;

  font-weight: 500;

  letter-spacing: .08em;

  color: rgba(17, 17, 17, .6);

  will-change: color;
}


.tabi-depth__scroll {
  display: flex;

  align-items: center;

  gap: 8px;
}


.tabi-depth__scroll-arrow {
  color: var(--tabi-red);

  font-size: 15px;

  will-change: color;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1100px) {

  #tabiDepthHero {
    min-height: 660px;
  }

  .tabi-depth__content {
    width: 54%;
    padding-bottom: 130px;
  }

  .tabi-depth__title {
    font-size: clamp(48px, 5.8vw, 82px);
  }

  .tabi-depth__sun-anchor,
  .tabi-depth__black-anchor {
    left: 75%;
    top: 47%;
    width: clamp(290px, 43vw, 470px);
  }

}


/* =========================================================
   MOBILE — HERO DE VIEWPORT REAL
========================================================= */

@media (max-width: 767px) {

  #tabiDepthHero {
    height: 100vh;
    height: 100svh;
    height: var(--tabi-hero-height, 100svh);
    min-height: 0;

    /* Mantém o gesto vertical nativo e evita trabalho extra no touch. */
    touch-action: pan-y;
    -webkit-tap-highlight-color: transparent;
  }

  /*
   Mantém as peças animadas em camadas próprias da GPU.
   Isso reduz tremidas durante o scroll em Chrome e Safari mobile.
  */
  .tabi-depth__black-reveal,
  .tabi-depth__sun-anchor,
  .tabi-depth__sun,
  .tabi-depth__mountain {
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }

  .tabi-depth__mountain {
    /* No mobile a prioridade é o movimento; a cor continua animando normalmente. */
    will-change: transform;
  }

  .tabi-depth__content {
    top: 0;
    bottom: auto;

    width: 100%;
    height: auto;

    justify-content: flex-start;

    padding:
      clamp(66px, 10svh, 92px)
      20px
      20px;
  }

  .tabi-depth__eyebrow {
    gap: 10px;
    margin-bottom: clamp(16px, 2.6svh, 22px);
    font-size: clamp(7px, 2vw, 8px);
  }

  .tabi-depth__eyebrow-dot {
    width: 6px;
    height: 6px;
    flex-basis: 6px;
  }

  .tabi-depth__title {
    max-width: 100%;
    font-size: clamp(39px, 12.4vw, 60px);
    line-height: .82;
    letter-spacing: -.047em;
  }

  .tabi-depth__title span {
    white-space: normal;
  }

  .tabi-depth__description {
    width: min(91%, 390px);
    margin-top: clamp(18px, 2.8svh, 24px);
    font-size: clamp(10.5px, 3vw, 12.5px);
    line-height: 1.55;
  }

  .tabi-depth__sun-anchor,
  .tabi-depth__black-anchor {
    left: 62%;
    top: 70%;
    width: clamp(215px, 66vw, 310px);
  }

  .tabi-depth__kanji {
    font-size: clamp(62px, 17vw, 92px);
  }

  .tabi-depth__mountain {
    left: -13%;
    width: 126%;
  }

  /* Montanhas menores e mais baixas somente no mobile.
     Isso libera o centro do sol e mantém o kanji visível. */
  .tabi-depth__mountain--haze {
    bottom: 9%;
    height: 25%;
  }

  .tabi-depth__mountain--far {
    bottom: 6%;
    height: 22%;
  }

  .tabi-depth__mountain--middle {
    bottom: 2%;
    height: 18.5%;
  }

  .tabi-depth__mountain--front {
    bottom: -1px;
    height: 14%;
  }

  .tabi-depth__footer {
    padding: 0 20px max(18px, env(safe-area-inset-bottom));
    font-size: 8px;
  }

}


/* Telefones estreitos */
@media (max-width: 390px) {

  .tabi-depth__content {
    padding-top: clamp(58px, 8svh, 76px);
  }

  .tabi-depth__title {
    font-size: clamp(36px, 11.8vw, 48px);
  }

  .tabi-depth__description {
    width: 94%;
    margin-top: 16px;
  }

  .tabi-depth__sun-anchor,
  .tabi-depth__black-anchor {
    top: 72%;
    width: 64vw;
  }

}


/* Mobile deitado */
@media (max-width: 900px) and (orientation: landscape) {

  #tabiDepthHero {
    min-height: 480px;
  }

  .tabi-depth__content {
    width: 54%;
    padding: 54px 0 70px 28px;
    justify-content: center;
  }

  .tabi-depth__eyebrow {
    margin-bottom: 14px;
  }

  .tabi-depth__title {
    font-size: clamp(36px, 7.1vw, 58px);
  }

  .tabi-depth__description {
    width: 90%;
    margin-top: 16px;
    font-size: 10px;
  }

  .tabi-depth__sun-anchor,
  .tabi-depth__black-anchor {
    left: 76%;
    top: 51%;
    width: min(38vw, 300px);
  }

  .tabi-depth__mountain--haze { height: 37%; }
  .tabi-depth__mountain--far { height: 33%; }
  .tabi-depth__mountain--middle { height: 28%; }
  .tabi-depth__mountain--front { height: 21%; }

  .tabi-depth__footer {
    padding: 0 28px 16px;
  }

}


</style>
<script>
    (function () {

  function initTabiDepthHero() {

    /* =====================================================
       DEPENDÊNCIAS
    ===================================================== */

    if (
      typeof window.gsap === "undefined" ||
      typeof window.ScrollTrigger === "undefined"
    ) {

      setTimeout(
        initTabiDepthHero,
        100
      );

      return;

    }


    gsap.registerPlugin(
      ScrollTrigger
    );


    /*
     Força transforms 3D e limita callbacks redundantes.
     O resultado é uma resposta mais direta ao gesto no mobile.
    */
    gsap.config({
      force3D: true
    });


    /* Evita saltos causados pela barra dinâmica do navegador mobile. */
    ScrollTrigger.config({
      ignoreMobileResize: true,
      limitCallbacks: true
    });


    /* =====================================================
       HERO
    ===================================================== */

    const hero =
      document.getElementById(
        "tabiDepthHero"
      );


    if (!hero) return;


    /*
     Congela a altura visual da hero durante o scroll mobile.
     A variável só é recalculada em mudanças reais de largura/orientação.
    */
    function setHeroViewportHeight() {

      hero.style.setProperty(
        "--tabi-hero-height",
        window.innerHeight + "px"
      );

    }


    setHeroViewportHeight();


    if (
      hero.dataset.tabiDepthInit === "true"
    ) {

      return;

    }


    hero.dataset.tabiDepthInit =
      "true";


    /* Remove uma instância antiga no editor do Elementor */

    const oldTrigger =
      ScrollTrigger.getById(
        "tabi-depth-scroll"
      );


    if (oldTrigger) {

      oldTrigger.kill(
        true
      );

    }


    /* =====================================================
       ELEMENTOS
    ===================================================== */

    const blackAnchor =
      hero.querySelector(
        ".tabi-depth__black-anchor"
      );


    const blackReveal =
      hero.querySelector(
        ".tabi-depth__black-reveal"
      );


    const redSunAnchor =
      hero.querySelector(
        ".tabi-depth__sun-anchor--red"
      );


    const whiteSunAnchor =
      hero.querySelector(
        ".tabi-depth__sun-anchor--white"
      );


    const redSun =
      hero.querySelector(
        ".tabi-depth__sun--red"
      );


    const whiteSun =
      hero.querySelector(
        ".tabi-depth__sun--white"
      );


    const redKanji =
      hero.querySelector(
        ".tabi-depth__kanji--red"
      );


    const whiteKanji =
      hero.querySelector(
        ".tabi-depth__kanji--white"
      );


    const hazeMountain =
      hero.querySelector(
        ".tabi-depth__mountain--haze"
      );


    const farMountain =
      hero.querySelector(
        ".tabi-depth__mountain--far"
      );


    const middleMountain =
      hero.querySelector(
        ".tabi-depth__mountain--middle"
      );


    const frontMountain =
      hero.querySelector(
        ".tabi-depth__mountain--front"
      );


    const titleLines =
      hero.querySelectorAll(
        ".tabi-depth__title > span"
      );


    const titleAccent =
      hero.querySelector(
        ".tabi-depth__title strong"
      );


    const description =
      hero.querySelector(
        ".tabi-depth__description"
      );


    const eyebrow =
      hero.querySelector(
        ".tabi-depth__eyebrow"
      );


    const eyebrowDot =
      hero.querySelector(
        ".tabi-depth__eyebrow-dot"
      );


    const footer =
      hero.querySelector(
        ".tabi-depth__footer"
      );


    const scrollArrow =
      hero.querySelector(
        ".tabi-depth__scroll-arrow"
      );


    /* =====================================================
       ESTADO INICIAL DA PAISAGEM

       MONTANHAS JÁ FICAM VISÍVEIS.
    ===================================================== */

    gsap.set(

      [
        hazeMountain,
        farMountain,
        middleMountain,
        frontMountain
      ],

      {
        x: 0,
        y: 0,

        xPercent: 0,
        yPercent: 0,

        scale: 1,

        opacity: 1,
        visibility: "visible"
      }

    );


    gsap.set(

      blackReveal,

      {
        scale: 0
      }

    );


    gsap.set(

      redSun,

      {
        scale: 1,
        opacity: 1
      }

    );


    gsap.set(

      redKanji,

      {
        scale: 1,
        opacity: 1
      }

    );


    gsap.set(

      whiteSun,

      {
        scale: .72,
        opacity: 0
      }

    );


    gsap.set(

      whiteSunAnchor,

      {
        x: 0,
        y: 0
      }

    );


    gsap.set(

      whiteKanji,

      {
        scale: 1,
        opacity: 1,

        color: "#111111"
      }

    );


    /* =====================================================
       ESCALA DO FUNDO PRETO
    ===================================================== */

    function getRevealCoverScale() {

      const heroWidth =
        hero.clientWidth;


      const heroHeight =
        hero.clientHeight;


      const radius =
        blackReveal.offsetWidth / 2;


      /*
       A propriedade left/top da âncora representa
       o centro do círculo.
      */

      const centerX =
        blackAnchor.offsetLeft;


      const centerY =
        blackAnchor.offsetTop;


      const maximumDistance =
        Math.max(

          Math.hypot(
            centerX,
            centerY
          ),

          Math.hypot(
            heroWidth - centerX,
            centerY
          ),

          Math.hypot(
            centerX,
            heroHeight - centerY
          ),

          Math.hypot(
            heroWidth - centerX,
            heroHeight - centerY
          )

        );


      return (

        maximumDistance /

        radius

      ) * 1.22;

    }


    /* =====================================================
       INTRO

       PAISAGEM NÃO É ANIMADA NA ENTRADA.
    ===================================================== */

    const intro =
      gsap.timeline({

        defaults: {
          ease: "power4.out"
        }

      });


    intro.fromTo(

      redSun,

      {
        scale: .72,
        opacity: 0
      },

      {
        scale: 1,
        opacity: 1,

        duration: 1.25,

        ease: "expo.out"
      }

    );


    intro.from(

      redKanji,

      {
        scale: .82,
        opacity: 0,

        duration: .85,

        ease: "power3.out"
      },

      .34

    );


    intro.from(

      titleLines,

      {
        yPercent: 105,
        opacity: 0,

        duration: 1,

        stagger: .07,

        ease: "power4.out"
      },

      .25

    );


    intro.from(

      eyebrow,

      {
        y: 14,
        opacity: 0,

        duration: .75
      },

      .55

    );


    intro.from(

      description,

      {
        y: 16,
        opacity: 0,

        duration: .8
      },

      .63

    );


    intro.from(

      footer,

      {
        opacity: 0,

        duration: .8
      },

      .72

    );


    /* =====================================================
       PARALLAX DO MOUSE
    ===================================================== */

    let scrollProgress = 0;


    const redSunX =
      gsap.quickTo(

        redSunAnchor,

        "x",

        {
          duration: 1.8,
          ease: "power3.out"
        }

      );


    const redSunY =
      gsap.quickTo(

        redSunAnchor,

        "y",

        {
          duration: 1.8,
          ease: "power3.out"
        }

      );


    const whiteSunX =
      gsap.quickTo(

        whiteSunAnchor,

        "x",

        {
          duration: 1.8,
          ease: "power3.out"
        }

      );


    const hazeX =
      gsap.quickTo(

        hazeMountain,

        "x",

        {
          duration: 2.4,
          ease: "power3.out"
        }

      );


    const farX =
      gsap.quickTo(

        farMountain,

        "x",

        {
          duration: 2,
          ease: "power3.out"
        }

      );


    const middleX =
      gsap.quickTo(

        middleMountain,

        "x",

        {
          duration: 1.65,
          ease: "power3.out"
        }

      );


    const frontX =
      gsap.quickTo(

        frontMountain,

        "x",

        {
          duration: 1.3,
          ease: "power3.out"
        }

      );


    const supportsPointerParallax =
      window.matchMedia(
        "(hover: hover) and (pointer: fine)"
      ).matches;


    if (supportsPointerParallax) hero.addEventListener(

      "pointermove",

      function (event) {

        if (
          window.innerWidth <= 767
        ) {

          return;

        }


        const rect =
          hero.getBoundingClientRect();


        const x =

          (
            event.clientX -
            rect.left
          )

          /

          rect.width

          -

          .5;


        const y =

          (
            event.clientY -
            rect.top
          )

          /

          rect.height

          -

          .5;


        if (
          scrollProgress < .12
        ) {

          redSunX(
            x * -11
          );


          redSunY(
            y * -7
          );

        }


        if (
          scrollProgress > .45
        ) {

          whiteSunX(
            x * -7
          );

        }


        hazeX(
          x * 4
        );


        farX(
          x * 8
        );


        middleX(
          x * 15
        );


        frontX(
          x * 25
        );

      }

    );


    if (supportsPointerParallax) hero.addEventListener(

      "pointerleave",

      function () {

        redSunX(0);
        redSunY(0);

        whiteSunX(0);

        hazeX(0);
        farX(0);
        middleX(0);
        frontX(0);

      }

    );


    /* =====================================================
       FUNÇÕES RESPONSIVAS DO PÔR DO SOL
    ===================================================== */

    function isMobileViewport() {

      return window.innerWidth <= 767;

    }


    function getSunsetFirstY() {

      return hero.clientHeight *
        (isMobileViewport() ? .06 : .14);

    }


    function getSunsetFinalY() {

      return hero.clientHeight *
        (isMobileViewport() ? .18 : .29);

    }


    function getScrollDistance() {

      const viewportHeight =
        Math.max(
          window.innerHeight,
          hero.clientHeight
        );


      if (window.innerWidth <= 767) {
        /*
         Uma distância menor deixa cada gesto produzir mais progresso,
         sem acelerar demais a narrativa.
        */
        return Math.round(viewportHeight * 1.55);
      }


      if (window.innerWidth <= 1100) {
        return Math.round(viewportHeight * 2.35);
      }


      return Math.round(viewportHeight * 3);

    }


    /* =====================================================
       TIMELINE DE SCROLL
    ===================================================== */

    const timeline =
      gsap.timeline({

        scrollTrigger: {

          id:
            "tabi-depth-scroll",

          trigger:
            hero,

          start:
            "top top",

          end:
            function () {
              return "+=" + getScrollDistance();
            },

          /*
           .65s criava a sensação de a animação ficar presa atrás do dedo.
           .12s remove o atraso, mas preserva uma pequena suavização.
          */
          scrub:
            isMobileViewport() ? .12 : 1,

          pin:
            true,

          pinSpacing:
            true,

          anticipatePin:
            isMobileViewport() ? .5 : 1,

          invalidateOnRefresh:
            true,


          onUpdate:
            function (self) {

              scrollProgress =
                self.progress;

            }

        }

      });


    /* =====================================================
       ATO 01 — FUNDO PRETO INVADE
    ===================================================== */

    timeline.to(

      blackReveal,

      {
        scale:
          function () {

            return getRevealCoverScale();

          },

        duration: .42,

        ease: "power2.inOut"
      },

      0

    );


    timeline.to(

      redSun,

      {
        scale: 1.14,

        duration: .28,

        ease: "power1.out"
      },

      0

    );


    timeline.to(

      redKanji,

      {
        opacity: 0,

        duration: .12,

        ease: "none"
      },

      .1

    );


    timeline.to(

      redSun,

      {
        opacity: 0,

        duration: .1,

        ease: "none"
      },

      .37

    );


    /*
     Consolida o background preto apenas quando
     o círculo já cobriu a hero.
    */

    timeline.set(

      hero,

      {
        backgroundColor: "#111111"
      },

      .415

    );


    /* =====================================================
       CORES DO TEXTO
    ===================================================== */

    timeline.to(

      titleLines,

      {
        color: "#EFEFEF",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      titleAccent,

      {
        color: "#F20C25",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      description,

      {
        color:
          "rgba(239,239,239,.70)",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      eyebrow,

      {
        color:
          "rgba(239,239,239,.62)",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      footer,

      {
        color:
          "rgba(239,239,239,.72)",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      eyebrowDot,

      {
        backgroundColor: "#F20C25",

        duration: .22,

        ease: "none"
      },

      .15

    );


    timeline.to(

      scrollArrow,

      {
        color: "#F20C25",

        duration: .22,

        ease: "none"
      },

      .15

    );


    /* =====================================================
       PROFUNDIDADE DA PAISAGEM
    ===================================================== */

    timeline.to(

      hazeMountain,

      {
        yPercent: -2,

        scale: 1.015,

        color: "#424242",

        duration: .42,

        ease: "none"
      },

      0

    );


    timeline.to(

      farMountain,

      {
        yPercent: -5,

        scale: 1.03,

        color: "#303030",

        duration: .42,

        ease: "none"
      },

      0

    );


    timeline.to(

      middleMountain,

      {
        yPercent: -9,

        scale: 1.055,

        color: "#1D1D1D",

        duration: .42,

        ease: "none"
      },

      0

    );


    timeline.to(

      frontMountain,

      {
        yPercent: -13,

        scale: 1.08,

        color: "#050505",

        duration: .42,

        ease: "none"
      },

      0

    );
    /* =====================================================
       ATO 02 — SOL BRANCO
    ===================================================== */

    timeline.to(

      whiteSun,

      {
        opacity: 1,

        scale: .92,

        duration: .2,

        ease: "expo.out"
      },

      .47

    );


    /* =====================================================
       ATO 03 — PÔR DO SOL
    ===================================================== */

    timeline.to(

      whiteSunAnchor,

      {
        y:
          function () {

            return getSunsetFirstY();

          },

        duration: .25,

        ease: "power2.inOut"
      },

      .6

    );


    timeline.to(

      whiteSunAnchor,

      {
        y:
          function () {

            return getSunsetFinalY();

          },

        duration: .28,

        ease: "power1.in"
      },

      .83

    );


    timeline.to(

      whiteSun,

      {
        scale: .84,

        duration: .28,

        ease: "power1.in"
      },

      .83

    );


    /* =====================================================
       PARALLAX FINAL DA PAISAGEM
    ===================================================== */

    timeline.to(

      hazeMountain,

      {
        yPercent: -4,

        scale: 1.025,

        duration: .5,

        ease: "none"
      },

      .48

    );


    timeline.to(

      farMountain,

      {
        yPercent: -8,

        scale: 1.05,

        duration: .5,

        ease: "none"
      },

      .48

    );


    timeline.to(

      middleMountain,

      {
        yPercent: -14,

        scale: 1.085,

        duration: .5,

        ease: "none"
      },

      .48

    );


    timeline.to(

      frontMountain,

      {
        yPercent: -20,

        scale: 1.12,

        duration: .5,

        ease: "none"
      },

      .48

    );
    /* =====================================================
       REFRESH
    ===================================================== */

    requestAnimationFrame(

      function () {

        ScrollTrigger.refresh();

      }

    );


    if (
      document.fonts &&
      document.fonts.ready
    ) {

      document.fonts.ready.then(

        function () {

          ScrollTrigger.refresh();

        }

      );

    }


    window.addEventListener(

      "load",

      function () {

        ScrollTrigger.refresh();

      },

      {
        once: true
      }

    );


    let resizeTimer;
    let lastViewportWidth = window.innerWidth;


    window.addEventListener(

      "resize",

      function () {

        const nextViewportWidth = window.innerWidth;
        const widthChanged =
          Math.abs(nextViewportWidth - lastViewportWidth) > 2;


        /*
         Em celulares, abrir/fechar a barra do navegador altera apenas
         a altura. Ignoramos esse falso resize para não quebrar o pin.
        */
        if (isMobileViewport() && !widthChanged) {
          return;
        }


        lastViewportWidth = nextViewportWidth;
        setHeroViewportHeight();

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(

          function () {
            ScrollTrigger.refresh();
          },

          220

        );

      },

      {
        passive: true
      }

    );


    window.addEventListener(

      "orientationchange",

      function () {

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(

          function () {
            lastViewportWidth = window.innerWidth;
            setHeroViewportHeight();
            ScrollTrigger.refresh();
          },

          320

        );

      },

      {
        passive: true
      }

    );

  }


  /* =====================================================
     ELEMENTOR SAFE INIT
  ===================================================== */

  function startTabiDepthHero() {

    initTabiDepthHero();

  }


  if (
    document.readyState === "loading"
  ) {

    document.addEventListener(

      "DOMContentLoaded",

      startTabiDepthHero,

      {
        once: true
      }

    );

  } else {

    startTabiDepthHero();

  }


  window.addEventListener(

    "elementor/frontend/init",

    function () {

      setTimeout(

        startTabiDepthHero,

        300

      );

    }

  );

})();
</script>
